name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This game's folder under the shared Dreamhost web root (DEPLOY_PATH).
# Each game repo sets its own — the site is served from <root>/<DEPLOY_SUBDIR>/.
env:
  DEPLOY_SUBDIR: call-sheet

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Rsync dist/ to Dreamhost (${{ env.DEPLOY_SUBDIR }}/)
        run: |
          set -euo pipefail
          # Deploy into this game's own subfolder under the shared web root.
          # --delete is scoped to TARGET, so sibling games are never touched.
          TARGET="${DEPLOY_PATH%/}/${DEPLOY_SUBDIR}"
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${TARGET}'"
          rsync -az --delete -e "$SSH" dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${TARGET}/"
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
